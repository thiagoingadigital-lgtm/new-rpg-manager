<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPG Manager — Entrar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-shell">
    <a class="auth-brand" href="index.html"><span class="v2-logo-mark">⌁</span><span><b>RPG MANAGER</b><small>ARQUIVO DE CAMPANHA</small></span></a>
    <section class="auth-card" aria-labelledby="auth-title">
      <span class="v2-kicker">ACESSO / 00</span>
      <h1 id="auth-title">Entre no seu<br /><em>arquivo.</em></h1>
      <p class="auth-intro">Suas fichas, mapas, registros e anotações ficam ligados à sua conta e às suas campanhas.</p>
      <div class="auth-tabs" role="tablist" aria-label="Acesso">
        <button type="button" class="auth-tab active" data-mode="login">Entrar</button>
        <button type="button" class="auth-tab" data-mode="register">Criar conta</button>
      </div>
      <form id="auth-form" novalidate>
        <label id="name-field" hidden>Nome<input id="auth-name" name="name" autocomplete="name" /></label>
        <label>E-mail<input id="auth-email" name="email" type="email" autocomplete="email" required /></label>
        <label>Senha<input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
        <button class="auth-submit" type="submit" id="auth-submit">Entrar ↗</button>
      </form>
      <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      <a class="auth-back" href="index.html">← Voltar ao arquivo</a>
    </section>
  </main>
  <script>
    const form = document.getElementById('auth-form');
    const nameField = document.getElementById('name-field');
    const nameInput = document.getElementById('auth-name');
    const submit = document.getElementById('auth-submit');
    const status = document.getElementById('auth-status');
    let mode = 'login';
    document.querySelectorAll('.auth-tab').forEach(tab => tab.addEventListener('click', () => {
      mode = tab.dataset.mode;
      document.querySelectorAll('.auth-tab').forEach(item => item.classList.toggle('active', item === tab));
      nameField.hidden = mode !== 'register';
      nameInput.required = mode === 'register';
      document.getElementById('auth-password').autocomplete = mode === 'register' ? 'new-password' : 'current-password';
      submit.textContent = mode === 'register' ? 'Criar conta ↗' : 'Entrar ↗';
      status.textContent = '';
    }));
    form.addEventListener('submit', async event => {
      event.preventDefault();
      status.className = 'auth-status loading';
      status.textContent = mode === 'register' ? 'Criando seu arquivo…' : 'Abrindo seu arquivo…';
      submit.disabled = true;
      try {
        const response = await fetch(`/api/auth/${mode}`, { method: 'POST', headers: {'Content-Type':'application/json'}, credentials: 'same-origin', body: JSON.stringify({ name: nameInput.value, email: document.getElementById('auth-email').value, password: document.getElementById('auth-password').value }) });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Não foi possível concluir o acesso.');
        status.className = 'auth-status success';
        status.textContent = 'Acesso confirmado. Redirecionando…';
        setTimeout(() => { location.href = 'index.html'; }, 350);
      } catch (error) {
        status.className = 'auth-status error';
        status.textContent = error.message;
      } finally { submit.disabled = false; }
    });
  </script>
</body>
</html>
